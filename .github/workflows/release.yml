# Publishes a release for a pushed tag vX.Y.Z. The tag is set by tools/release
# on a main commit whose CI is green, so build.yml repeats the same checks, now
# building the package from the tag.
#
# The signing key is a secret of the "release" environment, which only v* tags
# may use. The job that holds it runs no code from the repository: it signs,
# attests and uploads files the build jobs made.

name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      from-tag: true
    permissions:
      contents: read

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package

      - name: Collect the files
        run: |
          mkdir dist
          mv packaging/arch/*.pkg.tar.zst dist/
          cd dist
          package=$(ls ./*.pkg.tar.zst)
          arch=${package##*-}
          arch=${arch%%.pkg.tar.zst}
          # A fixed name for releases/latest/download/ (for curl, not pacman).
          cp "$package" "password-layout-$arch.pkg.tar.zst"

      - name: Sign
        env:
          GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          sign() {
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 "$@"
          }
          cd dist
          for package in ./*.pkg.tar.zst; do
            sign --detach-sign "$package"
          done
          sha256sum -- *.pkg.tar.zst *.sig > SHA256SUMS
          sign --armor --detach-sign SHA256SUMS
          rm -rf "$GNUPGHOME"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.pkg.tar.zst

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "password-layout ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            dist/*
