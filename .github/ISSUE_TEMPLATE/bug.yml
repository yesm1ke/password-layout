# GitHub rejects the whole form if a field label contains a word such as
# "password" (it keeps credentials out of public issues), so the labels below
# avoid it; descriptions may use it.
name: Something does not switch, or switches wrongly
description: The layout stays non-Latin at a password prompt, or changes where it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Where the password was asked for, what you expected, what the layout did.
      placeholder: "sudo in Ghostty inside tmux: the layout stayed Russian."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: "The output of `password-layout doctor`, run in the same session. It contains no secrets."
      render: text
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Program and system
      description: Terminal or application and its version, the program asking for the password, the distribution.
      placeholder: "Ghostty 1.3.1, tmux 3.5, Omarchy 4.0.4"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`pacman -Q password-layout`, or the commit when built from a checkout."
      placeholder: "password-layout 0.7.1-1"
  - type: textarea
    id: log
    attributes:
      label: Log around the moment (optional)
      description: "journalctl --user -u password-layout-tty --since '-5min' for terminals; the fcitx5 log for applications."
      render: text
