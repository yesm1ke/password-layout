name: Something does not switch, or switches wrongly
description: The layout stays non-Latin at a password prompt, or changes where it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Where the password was asked for, what you expected, what the layout did.
      placeholder: "sudo in Ghostty inside tmux: the layout stayed Russian."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of password-layout doctor
      description: Run it in the same session. It contains no passwords.
      render: text
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Program and system
      description: Terminal or application and its version, the program asking for the password, the distribution.
      placeholder: "Ghostty 1.3.1, tmux 3.5, Omarchy 4.0.4"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: password-layout version
      placeholder: "pacman -Q password-layout"
  - type: textarea
    id: log
    attributes:
      label: Log around the moment (optional)
      description: "journalctl --user -u password-layout-tty --since '-5min' for terminals; the fcitx5 log for applications."
      render: text
