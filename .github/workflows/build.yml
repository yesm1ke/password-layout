# Tests, builds and smoke-tests the package. Called by ci.yml for every pull
# request and push to main (the package is built from the commit under test)
# and by release.yml for a tag (built from the tag, like the AUR recipe).

name: build

on:
  workflow_call:
    inputs:
      from-tag:
        description: Build the package from the release tag instead of the commit under test.
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git fcitx5 tmux

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versions match the tag
        if: inputs.from-tag
        run: tools/check-version "${GITHUB_REF_NAME}"

      # CI containers have no TERM; the tests must not need one.
      - name: Tests
        run: |
          CXXFLAGS="-O2 -Werror" make
          CXXFLAGS="-O2 -Werror" make test

      # Leak checking needs ptrace, which containers usually do not allow;
      # memory errors and undefined behaviour are what matters here.
      - name: Tests with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
          CXXFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all
          LDFLAGS: -fsanitize=address,undefined
        run: |
          make clean
          make test

      - name: The addon never handles key events
        run: tools/check-addon-events

  package:
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git fcitx5 tmux namcap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # makepkg refuses to run as root.
      - name: Build the package
        env:
          FROM_TAG: ${{ inputs.from-tag }}
        run: |
          # actions/checkout trusts the workspace only for its own run.
          git config --global --add safe.directory "$PWD"
          root=$PWD
          commit=$(git rev-parse HEAD)
          # makepkg clones this checkout by its refs; a pull request's merge
          # commit is a detached HEAD, so give it one.
          git branch -f makepkg-source "$commit"
          useradd --create-home builder
          chown -R builder: .
          cd packaging/arch
          su builder -c 'makepkg --printsrcinfo' | diff -u .SRCINFO -
          # Outside a release the tag does not exist yet: build this commit.
          if [[ $FROM_TAG != true ]]; then
            sed -i "s|git+\$url.git#tag=v\$pkgver|git+file://$root#commit=$commit|" PKGBUILD
            grep -q "#commit=$commit" PKGBUILD
          fi
          # Runtime dependencies (Hyprland) are not needed to build or test.
          su builder -c 'makepkg --nodeps --noconfirm'
          # Arch's makepkg.conf also builds a -debug package; only the package
          # itself is shipped.
          rm -f ./*-debug-*.pkg.tar.zst
          namcap PKGBUILD
          namcap ./*.pkg.tar.zst

      - name: Release notes
        if: inputs.from-tag
        run: tools/release-notes "${GITHUB_REF_NAME#v}" > notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: |
            packaging/arch/*.pkg.tar.zst
            notes.md
          if-no-files-found: error

  smoke:
    needs: package
    runs-on: ubuntu-latest
    container: archlinux:base
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package

      # No systemd sessions here: the install script must skip them, not fail.
      - name: Install, run, remove
        run: |
          pacman -Syu --noconfirm
          pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
          pacman -Ql password-layout
          # The package enables nothing by itself (#25).
          ! pacman -Ql password-layout | grep -q '\.wants/'
          # The addon must ask for a fcitx5 series, not the exact fcitx5 this
          # container had: fcitx5 silently skips it on anything older.
          grep -E '^0=core:[0-9]+\.[0-9]+\.0$' /usr/share/fcitx5/addon/passwordlayout.conf
          set +e
          password-layout status
          code=$?
          set -e
          echo "exit code without Hyprland: $code"
          test "$code" -ge 1 && test "$code" -lt 128
          pacman -R --noconfirm password-layout
