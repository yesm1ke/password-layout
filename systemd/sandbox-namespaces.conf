# Sandboxing of password-layout-tty.service that needs unprivileged user
# namespaces (on by default in Arch's kernels, off in linux-hardened). Without
# them the service would not start; to turn just this part off, create an empty
# file with the same name:
#   mkdir -p ~/.config/systemd/user/password-layout-tty.service.d
#   touch ~/.config/systemd/user/password-layout-tty.service.d/sandbox-namespaces.conf
#
# PrivateTmp= and PrivateDevices= are left out on purpose: tmux keeps its
# sockets in /tmp, and terminals are in /dev/pts.
[Service]
PrivateUsers=self
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=%t
PrivateNetwork=yes
ProtectProc=invisible
ProcSubset=pid
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
